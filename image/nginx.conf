# Upstream's gateway.nginx.conf and frontend/apps/web/nginx.conf in one unprivileged nginx.
# boot.sh fills __PORT__ and __PUBLIC_HOST__.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Only Railway's edge reaches the public port, and it puts the client address in X-Real-IP.
    # The api trusts forwarded headers from loopback only (OMNARA_TRUSTED_PROXY_CIDRS), so its
    # per-client auth rate limits count the real client, not the edge hop.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Real-IP;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # gateway: v4 for Railway's healthchecker, v6 for the edge and private network.
    server {
        listen [::]:__PORT__ ipv6only=off;
        server_name _;
        client_max_body_size 100m;

        # The api 404s any Host but OMNARA_PUBLIC_URL's; Railway's prober sends
        # Host: healthcheck.railway.app, so pin the public host for the health route only.
        location = /healthz {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host __PUBLIC_HOST__;
        }

        location ~ ^/(?:api|mcp|install|\.well-known|healthz)(?:/|$) {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Event streams and daemon sockets are long-lived; do not buffer.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://127.0.0.1:8070;
            proxy_set_header Host $http_host;
        }
    }

    # web SPA, verbatim from upstream except the loopback listener.
    server {
        listen 127.0.0.1:8070;
        server_name _;

        root /usr/share/nginx/omnara;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types application/javascript image/svg+xml text/css;

        error_page 404 = @omnara_not_found;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 404;
        }

        location ~ ^/(?:api|mcp|install|\.well-known|healthz)(?:/|$) {
            return 404;
        }

        location ~ (^|/)\. {
            return 404;
        }

        location ~ ^/assets(?:/|$) {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location ~ \.[^/]+$ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff;
        }

        location = /index.html {
            try_files /index.html =404;
            charset utf-8;
            add_header Cache-Control no-cache;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4Z+0IbR8cDetVQawCZYyJN7DAZJUmjFGeS+nwKwqD8c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
            add_header Referrer-Policy no-referrer;
            add_header X-Content-Type-Options nosniff;
        }

        location / {
            try_files $uri /index.html;
            add_header X-Content-Type-Options nosniff;
        }

        location @omnara_not_found {
            types {}
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 404 '{"error":"not found"}';
        }
    }
}
